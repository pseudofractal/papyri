name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: nix flake check --print-build-logs --cores 4
      - run: nix build .#web .#papyri --print-build-logs --cores 4

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: ''
            args: '--bundles appimage,deb'
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: windows-x86_64
            os: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}
      - name: Build bundle
        run: npx tauri build ${{ matrix.args }}
      - name: Collect Linux assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/
      - name: Collect macOS asset
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg artifacts/
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Papyri.app" \
            "artifacts/Papyri-${{ github.ref_name }}-${{ matrix.name }}.zip"
      - name: Collect Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: papyri-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file docs/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Papyri $GITHUB_REF_NAME" \
              --notes-file docs/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
