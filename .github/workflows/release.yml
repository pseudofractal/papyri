name: Release candidate
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: nix flake check --print-build-logs --cores 4
      - run: nix build .#web .#mdview --print-build-logs --cores 4
