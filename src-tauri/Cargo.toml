[package]
name = "papyri"
version = "0.1.0"
description = "A Markdown, PDF, Typst, and LaTeX viewer with source editing"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[lib]
name = "papyri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

getrandom = "0.3"
libc = "0.2"
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "system-proxy"] }
flate2 = "1.1.11"
tar = "0.4.46"
xz2 = "0.1.7"
sha2 = "0.11.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
cairo-rs = { version = "0.18", features = ["png"] }
x11-dl = "2.21"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
javascriptcore-rs = "1.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
arboard = { version = "3", features = ["image-data"] }
png = "0.17"

[features]
custom-protocol = ["tauri/custom-protocol"]
