[package]
name = "mdview"
version = "0.1.0"
description = "A local, read-only Markdown viewer"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[lib]
name = "mdview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

getrandom = "0.3"
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
