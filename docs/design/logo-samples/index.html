    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mdview — 20 logo options</title>
    <style>
      :root {
        --logo-base: #1e1e2e;
        --logo-mauve: #cba6f7;
        --logo-lavender: #b4befe;
        --logo-teal: #94e2d5;
        --logo-pink: #f5c2e7;
        --logo-peach: #fab387;
        --logo-text: #cdd6f4;
        --logo-surface: #313244;
        --background: #181825;
        --foreground: #cdd6f4;
        --muted: #a6adc8;
        --card: #1e1e2e;
        --border: #45475a;
        --primary: #cba6f7;
        --radius: 16px;
        --font-sans: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      :root[data-palette='latte'] {
        --logo-base: #eff1f5;
        --logo-mauve: #8839ef;
        --logo-lavender: #7287fd;
        --logo-teal: #179299;
        --logo-pink: #ea76cb;
        --logo-peach: #fe640b;
        --logo-text: #4c4f69;
        --logo-surface: #ccd0da;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        color: var(--foreground);
        font-family: var(--font-sans);
      }
      button {
        font: inherit;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .switch {
        display: flex;
        gap: 5px;
      }
      .switch button,
      .close {
        padding: 7px 14px;
        border-radius: 9px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--foreground);
        cursor: pointer;
      }
      .switch button[aria-pressed='true'] {
        background: var(--primary);
        color: var(--logo-base);
        border-color: transparent;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .sample {
        padding: 16px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        color: var(--foreground);
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 11px;
        min-width: 0;
        transition: border-color 0.15s;
      }
      .sample:hover {
        border-color: var(--primary);
      }
      button:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }
      .main-icon svg {
        display: block;
        width: 88px;
        height: 88px;
      }
      .label {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 11px;
        white-space: nowrap;
      }
      .label b {
        color: var(--muted);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .sizes {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 24px;
      }
      .small svg {
        display: block;
        width: 24px;
        height: 24px;
      }
      .tiny svg {
        display: block;
        width: 16px;
        height: 16px;
      }
      dialog {
        width: min(430px, calc(100% - 32px));
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--foreground);
      }
      dialog::backdrop {
        background: #11111bcc;
      }
      .detail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .detail > svg {
        width: 224px;
        height: 224px;
        max-width: 100%;
      }
      .detail strong {
        font-size: 18px;
      }
      .close {
        display: block;
        margin-left: auto;
        margin-bottom: 12px;
      }
      .download {
        color: var(--primary);
        font-size: 13px;
      }
      @media (max-width: 520px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .label {
          font-size: 12px;
        }
      }
    </style>
  </head>

    <dialog aria-label="Logo preview">
      <button class="close" autofocus>Close</button>
      <div class="detail"></div>
    </dialog>
    <script>
      const dialog = document.querySelector('dialog');
      const detail = document.querySelector('.detail');
      let lastTrigger;
      document.querySelectorAll('[data-theme]').forEach((button) =>
        button.addEventListener('click', () => {
          document.documentElement.dataset.palette = button.dataset.theme;
          document
            .querySelectorAll('[data-theme]')
            .forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
        }),
      );
      document.querySelectorAll('.sample').forEach((button) =>
        button.addEventListener('click', () => {
          lastTrigger = button;
          const icon = button.querySelector('svg').cloneNode(true);
          const title = document.createElement('strong');
          title.textContent = button.querySelector('.label').textContent;
          detail.replaceChildren(icon, title);
          dialog.showModal();
        }),
      );
      document.querySelector('.close').addEventListener('click', () => dialog.close());
      dialog.addEventListener('close', () => lastTrigger?.focus());
      dialog.addEventListener('click', (event) => {
        if (event.target === dialog) {
          const bounds = dialog.getBoundingClientRect();
          if (
            event.clientX < bounds.left ||
            event.clientX > bounds.right ||
            event.clientY < bounds.top ||
            event.clientY > bounds.bottom
          )
            dialog.close();
        }
      });
    </script>
