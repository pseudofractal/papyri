    <title>Papyri logo studies</title>
    <style>
      :root {
        font-family: var(--font-sans, system-ui, sans-serif);
        color: var(--foreground);
      }
      body {
        margin: 0;
      }
      .spotlight {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
        padding: 8px 0 24px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }
      .large-mark {
        width: 100px;
        height: 100px;
        flex-shrink: 0;
      }
      .large-mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      h1 {
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.045em;
        margin: 0 0 8px;
      }
      .selected-label {
        font-size: 13px;
        color: var(--muted-foreground);
        margin: 0;
      }
      .sizes {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .sample {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sample .mini {
        display: block;
      }
      .mini svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .sample small {
        font: 11px var(--font-mono, monospace);
        color: var(--muted-foreground);
      }
      .inverse {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: var(--radius, 10px);
        background: var(--foreground);
        color: var(--background);
      }
      .inverse .mini {
        width: 36px;
        height: 36px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .tile {
        position: relative;
        min-width: 0;
        min-height: 140px;
        padding: 17px 12px 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: var(--radius, 10px);
        color: var(--foreground);
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      .tile:hover {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      .tile[aria-pressed='true'] {
        border-color: var(--foreground);
      }
      .tile:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      .tile > svg {
        display: block;
        width: 76px;
        height: 76px;
      }
      .tile-number {
        align-self: flex-start;
        font: 11px var(--font-mono, monospace);
        color: var(--muted-foreground);
      }
      .tile-label {
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
      }
      @media (max-width: 540px) {
        .gallery {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }
        .tile {
          min-height: 138px;
        }
        .spotlight {
          gap: 14px;
          padding-bottom: 18px;
        }
        .identity {
          gap: 12px;
        }
        .large-mark {
          width: 84px;
          height: 84px;
        }
        h1 {
          font-size: 30px;
        }
        .sizes {
          width: 100%;
          justify-content: flex-end;
          gap: 20px;
        }
        .inverse {
          margin-left: 8px;
        }
      }
    </style>
  </head>

    <script>
      (() => {
        const root = document.getElementById('papyri-studies');
        const buttons = [...root.querySelectorAll('.tile')];
        const select = (button) => {
          for (const tile of buttons) tile.setAttribute('aria-pressed', String(tile === button));
          root.querySelector('.selected-label').textContent =
            button.dataset.number + ' · ' + button.dataset.label;
          for (const target of root.querySelectorAll('.large-mark, .mini')) {
            const mark = button.querySelector('svg').cloneNode(true);
            if (target.classList.contains('large-mark')) {
              mark.removeAttribute('aria-hidden');
              mark.setAttribute('role', 'img');
              mark.setAttribute('aria-label', 'Papyri: ' + button.dataset.label);
            }
            target.replaceChildren(mark);
          }
        };
        for (const button of buttons) button.addEventListener('click', () => select(button));
        select(buttons[0]);
      })();
    </script>
