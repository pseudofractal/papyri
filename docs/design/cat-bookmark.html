<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>mdview monochrome cat bookmark</title>
    <style>
      :root {
        --background: #181818;
        --foreground: #ededed;
        --muted: #a3a3a3;
        --card: #232323;
        --border: #444;
        --primary: #ededed;
        --radius: 16px;
        --font-sans: ui-sans-serif, system-ui, sans-serif;
        --demo-accent: #cba6f7;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family: var(--font-sans);
        color: var(--foreground);
      }
      .samples {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .sample {
        padding: 24px 16px 20px;
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .dark {
        background: #202020;
        color: #f5f5f5;
      }
      .light {
        background: #f2f2f2;
        color: #242424;
      }
      .hero svg {
        width: 140px;
        height: 140px;
        display: block;
      }
      .sizes {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        height: 32px;
      }
      .sizes svg {
        display: block;
      }
      .size16 svg {
        width: 16px;
        height: 16px;
      }
      .size24 svg {
        width: 24px;
        height: 24px;
      }
      .size32 svg {
        width: 32px;
        height: 32px;
      }
      .label {
        font-size: 12px;
      }
      .controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
        font-size: 13px;
        color: var(--muted);
      }
      .controls label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      input[type='color'] {
        width: 32px;
        height: 28px;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--card);
      }
      body.accent .mark {
        color: var(--demo-accent);
      }
      input:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="samples">

      </div>
    </div>
    <div class="controls">
      <label><input type="checkbox" id="accent" />Simulate app accent</label
      ><input
        type="color"
        id="color"
        value="#cba6f7"
        aria-label="Simulated app accent color"
      /><span>Same SVG in every preview</span>
    </div>
    <script>
      const checkbox = document.querySelector('#accent');
      const color = document.querySelector('#color');
      checkbox.addEventListener('change', () =>
        document.body.classList.toggle('accent', checkbox.checked),
      );
      color.addEventListener('input', () => {
        document.documentElement.style.setProperty('--demo-accent', color.value);
        checkbox.checked = true;
        document.body.classList.add('accent');
      });
    </script>
  </body>
